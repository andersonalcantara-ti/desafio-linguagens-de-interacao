<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Web 2</title>
    <link rel="stylesheet" href="style.css"> <!--Link o arquivo .css-->
</head>

<body>
    <div class="container"> <!--Cria um container-->
        <h1>Minha Lista de Tarefas 📝</h1>

        <form id="form-tarefa"> 

            <input type="text" id="input-tarefa" placeholder="Qual é a sua próxima tarefa?" autocomplete="off" />

            <button type="submit">Adicionar</button>
        </form>

        <ul id="lista-de-tarefas"></ul> <!--Cria uma lista, sem os itens.-->
    </div>
    <script src="script.js"></script> <!--Link o arquivo .js-->
</body>

</html>
